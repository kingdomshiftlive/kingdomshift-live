			name = "Sync ScreenShare Version";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Sync MARKETING_VERSION from Runner to ScreenShare extension\n# Get the version from Runner's Info.plist or build settings\nRUNNER_VERSION=$(/usr/libexec/PlistBuddy -c \"Print :CFBundleShortVersionString\" \"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\" 2>/dev/null || echo \"${MARKETING_VERSION}\")\n\n# Try multiple possible paths for ScreenShare.appex\nSCREENSHARE_PATHS=(\n    \"${BUILT_PRODUCTS_DIR}/ScreenShare.appex/Info.plist\"\n    \"${TARGET_BUILD_DIR}/ScreenShare.appex/Info.plist\"\n    \"${TARGET_BUILD_DIR}/${WRAPPER_NAME}/PlugIns/ScreenShare.appex/Info.plist\"\n    \"${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/PlugIns/ScreenShare.appex/Info.plist\"\n)\n\n# Find and update ScreenShare Info.plist\nUPDATED=0\nfor SCREENSHARE_PLIST in \"${SCREENSHARE_PATHS[@]}\"; do\n    if [ -f \"${SCREENSHARE_PLIST}\" ]; then\n        # Update CFBundleShortVersionString in ScreenShare extension\n        /usr/libexec/PlistBuddy -c \"Set :CFBundleShortVersionString ${RUNNER_VERSION}\" \"${SCREENSHARE_PLIST}\" 2>/dev/null || \\\n        /usr/libexec/PlistBuddy -c \"Add :CFBundleShortVersionString string ${RUNNER_VERSION}\" \"${SCREENSHARE_PLIST}\" 2>/dev/null\n        if [ $? -eq 0 ]; then\n            echo \"✓ Synced ScreenShare version to ${RUNNER_VERSION} at ${SCREENSHARE_PLIST}\"\n            UPDATED=1\n            break\n        fi\n    fi\ndone\n\nif [ $UPDATED -eq 0 ]; then\n    echo \"⚠ Warning: Could not find ScreenShare.appex/Info.plist to update version\"\nfi\n";
			showEnvVarsInLog = 0;
		};
